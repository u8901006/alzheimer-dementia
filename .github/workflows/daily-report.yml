name: Alzheimer Dementia Daily Report

on:
  schedule:
    - cron: "20 11 * * *" # UTC 11:20 = GMT+8 19:20
  workflow_dispatch:
    inputs:
      date:
        description: "Target date (YYYY-MM-DD), leave empty for today"
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Determine date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "target=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            TARGET=$(TZ=Asia/Taipei date +%Y-%m-%d)
            echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          fi
          echo "Date: $(grep target "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: Debug API access
        run: |
          echo "--- Testing Europe PMC API ---"
          curl -s "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=Alzheimer&resultType=core&pageSize=3&format=json" | head -c 1000
          echo ""
          echo "--- Testing PubMed API ---"
          curl -s "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=Alzheimer&retmax=3&retmode=json" | head -c 500

      - name: Fetch papers from PubMed
        run: python3 scripts/fetch_papers.py --days 7 --max-papers 40 --output papers.json
        continue-on-error: true
        timeout-minutes: 15
        env:
          TARGET_DATE: ${{ steps.date.outputs.target }}

      - name: Check papers data
        id: papers
        run: |
          if [ -f papers.json ] && grep -q '"count"' papers.json; then
            COUNT=$(node -e "const d=JSON.parse(require('fs').readFileSync('papers.json','utf8')); console.log(d.count||0)")
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
            echo "Papers found: $COUNT"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            node -e "require('fs').writeFileSync('papers.json',JSON.stringify({date:'${{ steps.date.outputs.target }}',count:0,papers:[]},null,2))"
            echo "No papers found, will generate empty report"
          fi

      - name: Generate report with Zhipu AI
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          TARGET_DATE: ${{ steps.date.outputs.target }}
        run: node scripts/generate-report.mjs --input papers.json --output docs/alzheimer-${{ steps.date.outputs.target }}.html
        timeout-minutes: 10

      - name: Ensure .nojekyll
        run: touch docs/.nojekyll

      - name: Generate index page
        run: node scripts/generate-index.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "alzheimer dementia daily report: ${{ steps.date.outputs.target }}"
          git pull --rebase origin main
          git push

      - name: Summary
        run: |
          echo "### Alzheimer's Disease Daily Report" >> "$GITHUB_STEP_SUMMARY"
          echo "**Date:** ${{ steps.date.outputs.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Papers analyzed:** ${{ steps.papers.outputs.count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Report:** [alzheimer-${{ steps.date.outputs.target }}.html](https://u8901006.github.io/alzheimer-dementia/alzheimer-${{ steps.date.outputs.target }}.html)" >> "$GITHUB_STEP_SUMMARY"
